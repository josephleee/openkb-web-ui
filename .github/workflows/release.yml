# Publish openkb-web to PyPI when a GitHub release is published.
#
# Builds the frontend, then the sdist and wheel (backend/hatch_build.py puts
# the built UI inside both), and uploads them with PyPI trusted publishing:
# GitHub's OIDC token is exchanged for a short-lived upload token, so no PyPI
# token is stored in this repository.
#
# This workflow runs only on release publication; until PyPI is configured the
# publish job fails at upload. One-time setup on PyPI (account > Publishing >
# add a pending publisher): project name "openkb-web", owner "josephleee",
# repository "openkb-web-ui", workflow "release.yml", environment "pypi".
#
# Release checklist: bump `version` in backend/pyproject.toml and
# `__version__` in backend/openkb_web/__init__.py, merge, then publish a
# release whose tag is that version (e.g. v0.2.0). The build fails if they
# disagree.

name: Release

on:
  release:
    types: [published]

permissions: {}

# One release upload at a time; never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No caches in a release build (cache poisoning).
          package-manager-cache: false

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build the sdist and wheel
        working-directory: backend
        run: uv build

      - name: Check the artifacts
        working-directory: backend
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          sdist="dist/openkb_web-${version}.tar.gz"
          wheel="dist/openkb_web-${version}-py3-none-any.whl"
          if [ ! -f "$sdist" ] || [ ! -f "$wheel" ]; then
            echo "::error::Release tag $TAG does not match the version in backend/pyproject.toml (built: $(ls dist))"
            exit 1
          fi
          if ! grep -qx "__version__ = \"${version}\"" openkb_web/__init__.py; then
            echo "::error::__version__ in backend/openkb_web/__init__.py is not ${version}"
            exit 1
          fi
          unzip -l "$wheel" | grep -q ' openkb_web/static/index.html$' \
            || { echo "::error::wheel has no bundled frontend"; exit 1; }
          tar -tzf "$sdist" | grep -q '/openkb_web/static/index.html$' \
            || { echo "::error::sdist has no bundled frontend"; exit 1; }
          uvx twine==7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: backend/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openkb-web
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
